let lang=localStorage.getItem('eco-lang')||'ru';if(!words[lang])lang='ru';let map=null;
const tr=k=>words[lang][k]||words.ru[k]||k, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=()=>{try{return JSON.parse(localStorage.getItem('eco-bostonliq-site-v2'))||{reports:[],registered:false,profile:{name:'',email:''},feedback:[]}}catch{return{reports:[],registered:false,profile:{name:'',email:''},feedback:[]}}};let data=read();const save=()=>localStorage.setItem('eco-bostonliq-site-v2',JSON.stringify(data));
function toast(text){const e=document.querySelector('#toast');e.textContent=text;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',3200)}
function nav(){document.documentElement.lang=lang;document.querySelector('#languages').setAttribute('aria-label',tr('langName'));document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',String(b.dataset.lang===lang))});document.querySelector('#nav').innerHTML=['home','map','report','events','news','wallet','profile'].map(k=>`<a href="#/${k==='home'?'':k}">${tr(k)}</a>`).join('')}
function home(){return`<section class="card hero"><span class="tag">${tr('heroKicker')}</span><h1>${tr('heroTitle')}</h1><p>${tr('heroText')}</p><div class="actions"><a class="primary" href="#/report">${tr('reportCta')}</a><a class="secondary" href="#/map">${tr('mapCta')}</a></div></section><section class="grid"><div class="stat"><b>${tr('statPlace')}</b>${tr('statPlaceText')}</div><div class="stat"><b>${tr('statLearn')}</b>${tr('statLearnText')}</div><div class="stat"><b>${tr('statPoints')}</b>${tr('statPointsText')}</div></section><div class="card">${tr('localReports')} <b>${data.reports.length}</b></div><h2>${tr('latestNews')}</h2><article class="card"><h3>${tr('sampleNews')}</h3><p>${tr('sampleNewsText')}</p></article>`}
function reportPage(){return`<h1>${tr('reportTitle')}</h1><div class="card notice">${tr('localOnly')}</div><form id="report-form" class="card"><label>${tr('category')}</label><select name="category"><option>${tr('catWaste')}</option><option>${tr('catWater')}</option><option>${tr('catAir')}</option><option>${tr('catFire')}</option><option>${tr('catTree')}</option><option>${tr('catOther')}</option></select><label>${tr('territory')}</label><select name="territory"><option>${tr('choose')}</option><option>${tr('charvak')}</option><option>${tr('chimghan')}</option><option>${tr('beldersay')}</option></select><label>${tr('title')}</label><input name="title" required minlength="3"><label>${tr('description')}</label><textarea name="description" required minlength="10" rows="4"></textarea><label>${tr('location')}</label><div id="map"></div><button id="geo" class="secondary" type="button">${tr('useLocation')}</button><label>${tr('latitude')}</label><input id="lat" name="lat" type="number" step="any" required><label>${tr('longitude')}</label><input id="lng" name="lng" type="number" step="any" required><label>${tr('photo')}</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp"><button class="primary" type="submit">${tr('saveReport')}</button></form>`}
function eventsPage(){return`<h1>${tr('eventsTitle')}</h1><article class="card"><h2>${tr('sampleEvent')}</h2><p>${tr('sampleEventText')}</p><p>${tr('eventDate')} · ${tr('places')}: 30 · 5 EcoBall ${tr('reward')}</p><button id="signup" class="primary">${data.registered?tr('signedUp'):tr('signUp')}</button></article>`}
function page(route){if(route==='/'||route==='/home')return home();if(route==='/map')return`<h1>${tr('mapTitle')}</h1><div id="map"></div><p>${tr('mapHint')}</p>`;if(route==='/report')return reportPage();if(route==='/events')return eventsPage();if(route==='/news')return`<h1>${tr('newsTitle')}</h1><article class="card"><h2>${tr('sampleNews')}</h2><p>${tr('sampleNewsText')}</p></article>`;if(route==='/wallet')return`<h1>${tr('walletTitle')}</h1><div class="card"><b>${tr('balance')}: ${data.reports.length*10} EcoBall</b><p>${tr('walletText')}</p></div>`;if(route==='/profile')return`<h1>${tr('profileTitle')}</h1><div class="card">${tr('profileText')}</div><form id="profile-form" class="card"><label>${tr('name')}</label><input name="name" value="${esc(data.profile.name)}"><label>${tr('email')}</label><input name="email" type="email" value="${esc(data.profile.email)}"><button class="primary">${tr('save')}</button></form>`;if(route==='/faq')return`<h1>${tr('faqTitle')}</h1><div class="card"><b>${tr('faq1')}</b><p>${tr('faq1a')}</p></div><div class="card"><b>${tr('faq2')}</b><p>${tr('faq2a')}</p></div>`;if(route==='/privacy')return`<h1>${tr('privacyTitle')}</h1><div class="card"><p>${tr('privacyText')}</p></div>`;if(route==='/terms')return`<h1>${tr('termsTitle')}</h1><div class="card"><p>${tr('termsText')}</p></div>`;if(route==='/feedback')return`<h1>${tr('feedbackTitle')}</h1><div class="card">${tr('feedbackText')}</div><form id="feedback-form" class="card"><label>${tr('message')}</label><textarea name="message" required minlength="5"></textarea><button class="primary">${tr('send')}</button></form>`;return`<h1>${tr('notFound')}</h1>`}
function setupMap(route){if(map){map.remove();map=null}if(!document.querySelector('#map')||!window.L)return;map=L.map('map').setView([41.58,69.98],10);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);if(route==='/map'){data.reports.forEach(r=>L.marker([r.lat,r.lng]).addTo(map).bindPopup(esc(r.title)))}if(route==='/report'){map.on('click',e=>{document.querySelector('#lat').value=e.latlng.lat.toFixed(6);document.querySelector('#lng').value=e.latlng.lng.toFixed(6)});document.querySelector('#geo').onclick=()=>{if(!navigator.geolocation){toast(tr('selectPoint'));return}navigator.geolocation.getCurrentPosition(p=>{document.querySelector('#lat').value=p.coords.latitude.toFixed(6);document.querySelector('#lng').value=p.coords.longitude.toFixed(6);map.setView([p.coords.latitude,p.coords.longitude],15)},()=>toast(tr('selectPoint')),{timeout:10000})}}}
function render(){const route=location.hash.slice(1)||'/';nav();document.querySelector('#app').innerHTML=page(route);document.title=`ECO BOSTONLIQ — ${tr(route==='/ '||route==='/'?'home':route.slice(1))}`;setupMap(route);const rf=document.querySelector('#report-form');if(rf)rf.onsubmit=e=>{e.preventDefault();const f=new FormData(rf),lat=Number(f.get('lat')),lng=Number(f.get('lng'));if(!f.get('title')||String(f.get('description')).trim().length<10){toast(tr('required'));return}if(!Number.isFinite(lat)||!Number.isFinite(lng)){toast(tr('selectPoint'));return}data.reports.push({title:f.get('title'),category:f.get('category'),lat,lng});save();toast(tr('reportSaved'));location.hash='#/map'};const sf=document.querySelector('#signup');if(sf)sf.onclick=()=>{data.registered=true;save();render()};const pf=document.querySelector('#profile-form');if(pf)pf.onsubmit=e=>{e.preventDefault();const f=new FormData(pf);data.profile={name:f.get('name'),email:f.get('email')};save();toast(tr('saved'))};const ff=document.querySelector('#feedback-form');if(ff)ff.onsubmit=e=>{e.preventDefault();data.feedback.push(new FormData(ff).get('message'));save();ff.reset();toast(tr('messageSaved'))}}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('eco-lang',lang);render()}));window.addEventListener('hashchange',render);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
